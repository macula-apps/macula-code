name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # The structural floor (macula-codebase-checks#9): max-depth 3 and
      # complexity 9, both at error, in .eslintrc.json. A function that
      # nests or branches past them fails here.
      - name: Lint (structural floor)
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test
